name: DOM integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - run: npm install --no-audit --no-fund --prefix /tmp/lab-ui jsdom@31.0.0
      - run: NODE_PATH=/tmp/lab-ui/node_modules node tests/ui_smoke.cjs

