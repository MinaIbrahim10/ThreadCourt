[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadcourt"
version = "0.1.0"
description = "Evidence-driven multi-agent concurrency model laboratory with local Gemma 4"
requires-python = ">=3.11"
authors = [{name = "Mina Ibrahim"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
threadcourt = "threadcourt.__main__:main"

[tool.setuptools.package-data]
threadcourt = ["dashboard.html"]
